    <script>
        // Suppress benign Vite WebSocket connection errors in sandboxed preview
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
    </script>

<div id="root">
    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:9999;">
        <style>
            @keyframes initial-heartbeat {
              0% { transform: scale(1); }
              14% { transform: scale(1.12); }
              28% { transform: scale(1); }
              42% { transform: scale(1.18); }
              70% { transform: scale(1); }
              100% { transform: scale(1); }
            }
            @keyframes initial-pulse {
              0%, 100% { transform: scale(0.95); opacity: 0.5; }
              50% { transform: scale(1.2); opacity: 0.15; }
            }
            @keyframes initial-bar {
              0% { transform: translateX(-100%); }
              50% { transform: translateX(100%); }
              100% { transform: translateX(200%); }
            }
            .initial-logo-pulse {
              animation: initial-heartbeat 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            }
            .initial-ring {
              animation: initial-pulse 2.2s infinite;
            }
            .initial-bar-anim {
              animation: initial-bar 1.4s ease-in-out infinite;
            }
        </style>
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
            <div class="initial-ring" style="position:absolute;width:140px;height:140px;border-radius:50%;background:#e0f2fe;pointer-events:none;"></div>
            <div class="initial-logo-pulse" style="position:relative;z-index:1;margin-bottom:16px;">

                <div class="initial-bar-anim" style="width:50%;height:100%;background:#0369a1;border-radius:9999px;"></div>
            </div>
        </div>
    </div>
